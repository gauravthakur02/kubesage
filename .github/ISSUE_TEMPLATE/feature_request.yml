name: Feature request
description: An idea to make kubeweave more useful
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or task, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could kubeweave help?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you do it today?
