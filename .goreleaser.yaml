# Release with: git tag v0.2.0 && git push origin v0.2.0  (the release workflow runs GoReleaser)
# Test locally:  goreleaser release --snapshot --clean   (everything lands in dist/)
version: 2
project_name: kubesage

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    ldflags:
      - -s -w -X main.version={{ .Version }}
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible builds

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # kubesage_0.2.0_linux_arm64.tar.gz · kubesage_0.2.0_darwin_arm64.tar.gz · kubesage_0.2.0_windows_amd64.zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}
    files: [LICENSE, README.md]

# Linux packages: .deb (Debian/Ubuntu), .rpm (RHEL/Fedora/SUSE) and .apk (Alpine).
nfpms:
  - package_name: kubesage
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: kubesage
    homepage: https://github.com/gauravthakur02/kubesage
    maintainer: Gaurav Thakur <https://github.com/gauravthakur02>
    description: Kubernetes IDE for your terminal with an AI copilot
    license: MIT
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    section: utils
    contents:
      - src: LICENSE
        dst: /usr/share/doc/kubesage/LICENSE
      - src: README.md
        dst: /usr/share/doc/kubesage/README.md
    recommends: [kubectl]

# macOS Gatekeeper blocks downloaded binaries that Apple has not notarized ("Apple could not verify…").
# Signing + notarization runs on the Linux release runner and switches on once these repository secrets exist
# (Apple Developer Program membership needed):
#   MACOS_SIGN_P12           base64 of the "Developer ID Application" certificate exported as .p12
#   MACOS_SIGN_PASSWORD      the .p12 password
#   MACOS_NOTARY_ISSUER_ID   App Store Connect API key: issuer ID
#   MACOS_NOTARY_KEY_ID      App Store Connect API key: key ID
#   MACOS_NOTARY_KEY         base64 of the AuthKey_<id>.p8 file
notarize:
  macos:
    - enabled: '{{ if index .Env "MACOS_SIGN_P12" }}true{{ else }}false{{ end }}'
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive # an SPDX bill of materials per archive (needs syft on PATH)
    disable: '{{ if index .Env "KUBESAGE_SBOM" }}false{{ else }}true{{ end }}'

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  github:
    owner: gauravthakur02
    name: kubesage
  footer: |
    ## Install
    **macOS / Linux:** `curl -fsSL https://raw.githubusercontent.com/gauravthakur02/kubesage/main/install.sh | sh`
    **Windows (PowerShell):** `irm https://raw.githubusercontent.com/gauravthakur02/kubesage/main/install.ps1 | iex`
    **Debian/Ubuntu:** `sudo apt install ./kubesage_{{ .Version }}_amd64.deb` · **RHEL/Fedora:** `sudo dnf install ./kubesage-{{ .Version }}-1.x86_64.rpm`
    Verify downloads against `checksums.txt`.

# Homebrew and Scoop publish only when their tokens are configured as repository secrets
# (HOMEBREW_TAP_GITHUB_TOKEN / SCOOP_BUCKET_GITHUB_TOKEN) and the repos below exist.
homebrew_casks:
  - name: kubesage
    repository:
      owner: gauravthakur02
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    homepage: https://github.com/gauravthakur02/kubesage
    description: Kubernetes IDE for your terminal with an AI copilot
    license: MIT
    binaries: [kubesage]
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/kubesage"]
          end

scoops:
  - name: kubesage
    repository:
      owner: gauravthakur02
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    skip_upload: '{{ if index .Env "SCOOP_BUCKET_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    homepage: https://github.com/gauravthakur02/kubesage
    description: Kubernetes IDE for your terminal with an AI copilot
    license: MIT
