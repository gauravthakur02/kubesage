<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="kubeweave icon">
  <title>kubeweave</title>
  <defs>
    <linearGradient id="wheel" gradientUnits="userSpaceOnUse" x1="20" y1="20" x2="236" y2="236">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3e88d"/>
      <stop offset="1" stop-color="#73daca"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2335"/>
      <stop offset="1" stop-color="#16161e"/>
    </linearGradient>
  </defs>
  <style>
    /* The wheel turns slowly, the leaf breathes, the sparkles twinkle. */
    .spin    { transform-box: fill-box; transform-origin: center; animation: spin 18s linear infinite; }
    .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 3.6s ease-in-out infinite; }
    .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
    .twinkle2{ transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out 1.2s infinite; }
    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: .85; } }
    @keyframes twinkle { 0%,100% { transform: scale(1) rotate(0deg); opacity: 1; } 50% { transform: scale(.45) rotate(45deg); opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .spin, .breathe, .twinkle, .twinkle2 { animation: none; } }
  </style>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- helm wheel (Kubernetes) -->
  <g class="spin"><g stroke="url(#wheel)" stroke-width="10" stroke-linecap="round" fill="none">
    <line x1="128.0" y1="88.0" x2="128.0" y2="31.0"/><line x1="156.3" y1="99.7" x2="196.6" y2="59.4"/><line x1="168.0" y1="128.0" x2="225.0" y2="128.0"/><line x1="156.3" y1="156.3" x2="196.6" y2="196.6"/><line x1="128.0" y1="168.0" x2="128.0" y2="225.0"/><line x1="99.7" y1="156.3" x2="59.4" y2="196.6"/><line x1="88.0" y1="128.0" x2="31.0" y2="128.0"/><line x1="99.7" y1="99.7" x2="59.4" y2="59.4"/>
    <circle cx="128" cy="128" r="78" stroke-width="13"/>
  </g>
  <g fill="url(#wheel)"><circle cx="128.0" cy="22.0" r="9"/><circle cx="203.0" cy="53.0" r="9"/><circle cx="234.0" cy="128.0" r="9"/><circle cx="203.0" cy="203.0" r="9"/><circle cx="128.0" cy="234.0" r="9"/><circle cx="53.0" cy="203.0" r="9"/><circle cx="22.0" cy="128.0" r="9"/><circle cx="53.0" cy="53.0" r="9"/></g></g>
  <!-- hub with a sage leaf (the copilot) -->
  <circle cx="128" cy="128" r="38" fill="#1a1b26" stroke="url(#wheel)" stroke-width="8"/>
  <g class="breathe"><path d="M128 100 C150 110 154 136 128 158 C102 136 106 110 128 100 Z" fill="url(#leaf)"/>
  <path d="M128 106 L128 152 M128 124 L139 116 M128 136 L118 128" stroke="#1a1b26" stroke-width="3.2" stroke-linecap="round" fill="none"/></g>
  <!-- AI spark -->
  <path class="twinkle" d="M226 14 L230.5 27.5 L244 32 L230.5 36.5 L226 50 L221.5 36.5 L208 32 L221.5 27.5 Z" fill="#bb9af7"/>
  <path class="twinkle2" d="M244 58 L246 63 L251 65 L246 67 L244 72 L242 67 L237 65 L242 63 Z" fill="#7dcfff"/>
</svg>
