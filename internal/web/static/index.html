<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kubesage</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%237aa2f7' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23bb9af7'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
<meta name="kubesage-token" content="{{TOKEN}}">
<script src="/static/app.js" defer></script>
</head>
<body>
<a class="skip" href="#table">Skip to the table</a>
<header class="top">
  <div class="brand" title="kubesage">⎈ <b>kubesage</b></div>
  <label class="pick" title="Cluster (c)"><span>cluster</span><select id="ctx"></select></label>
  <label class="pick" title="Namespace (n)"><span>namespace</span><select id="ns"></select></label>
  <div class="search"><input id="filter" type="search" placeholder="Filter rows   /" autocomplete="off" spellcheck="false"></div>
  <span id="mode" class="badge" role="status"></span>
  <span id="forwards" class="forwards" aria-label="Active port-forwards"></span>
  <button id="chatBtn" class="ghost hidden" title="Ask the AI about this namespace (A)">AI</button>
  <button id="paletteBtn" class="ghost" title="Command palette (Ctrl+K)">⌘K</button>
  <button id="helpBtn" class="ghost" title="Keyboard shortcuts (?)">?</button>
  <a id="termLink" class="ghost" title="The full terminal UI in the browser">terminal</a>
  <span id="user" class="user"></span>
</header>
<div class="body">
  <nav id="side" class="side" aria-label="Resources"></nav>
  <main class="main">
    <div class="tablehead">
      <h1 id="title">Loading…</h1>
      <span id="note" class="muted"></span>
      <span class="spacer"></span>
      <span id="updated" class="muted"></span>
      <button id="refreshBtn" class="ghost" title="Refresh (r)">↻</button>
    </div>
    <div id="bulk" class="bulk hidden" role="region" aria-label="Selected rows"></div>
    <div class="tablewrap" id="tablewrap"><table id="table" tabindex="-1" aria-describedby="note"><thead></thead><tbody></tbody></table>
      <div id="empty" class="empty hidden"></div>
      <button id="more" class="ghost more hidden">Load 500 more</button></div>
  </main>
  <aside id="panel" class="panel hidden" aria-label="Details">
    <div class="panelhead">
      <div><div id="pkind" class="muted"></div><h2 id="pname"></h2></div>
      <span class="spacer"></span>
      <div id="pactions" class="actions"></div>
      <button id="pclose" class="ghost" title="Close (Esc)">✕</button>
    </div>
    <div id="ptabs" class="tabs" role="tablist" aria-label="Detail views"></div>
    <div id="pbody" class="pbody" role="tabpanel"></div>
  </aside>
</div>
<div id="overlay" class="overlay hidden"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
